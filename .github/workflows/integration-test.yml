name: Integration Tests

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-discover:
    name: Discover Integration Tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validating config with schemas
        run: |
          scripts/validate-config-with-schemas.sh

      - id: collect
        name: Collect integration tests
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          tests = subprocess.check_output(
              ["pytest", "--collect-only", "-q", "-m", "integration and not proxy_integration"],
              text=True,
          ).splitlines()
          node_ids = [line for line in tests if "::" in line]
          matrix = {"include": [{"test": test} for test in node_ids]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={json.dumps(matrix)}\n")
          PY

      - name: Print integration matrix
        env:
          MATRIX_JSON: ${{ steps.collect.outputs.matrix }}
        run: |
          printf '%s\n' "$MATRIX_JSON" | python -m json.tool

  integration:
    name: Integration (${{ matrix.test }})
    runs-on: ubuntu-latest
    needs: integration-discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.integration-discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validating config with schemas
        run: |
          scripts/validate-config-with-schemas.sh

      - name: Run integration test
        env:
          AICAGE_RUN_INTEGRATION: "1"
          TEST_NODE: ${{ matrix.test }}
        run: pytest -m "integration and not proxy_integration" "$TEST_NODE"

      - name: "On failure: Collect aicage logs"
        if: failure()
        env:
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          artifact_dir="$RUNNER_TEMP/aicage-logs-$JOB_INDEX"
          mkdir -p "$artifact_dir"
          while IFS= read -r path; do
            rel_path="${path#/}"
            target_dir="$artifact_dir/$(dirname "$rel_path")"
            mkdir -p "$target_dir"
            cp -R "$path" "$target_dir/"
          done < <(
            find "${TMPDIR:-/tmp}" \
              \( -type d -path "*/pytest-of-${USER}/*/.aicage" \
              -o -type d -path "*/aicage-test-home-*/.aicage" \) \
              2>/dev/null | sort -u
          )

      - name: "On failure: Upload aicage logs"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: aicage-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/aicage-logs-${{ strategy.job-index }}
          if-no-files-found: ignore
